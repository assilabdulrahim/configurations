### LLM & Encoding settings ###
# cl100k_base is only the tiktoken tokenizer used for chunk-size counting.
# It is cached from your previous successful run, so no network fetch is needed.
encoding_model: cl100k_base

### Model Definitions ###
completion_models:
  default_completion_model:
    model_provider: openai            # "OpenAI-compatible protocol" = how Ollama exposes /v1
    model: qwen3:32b                  # CHANGED from qwen3-coder-next:latest.
                                      # Reason: Saadeh corpus is Arabic prose, not code.
                                      # Qwen3 is strong on Arabic and matches your qwen3 embedder/reranker.
                                      # REQUIRES: `ollama pull qwen3:32b` before launching.
                                      # No-download fallback: llama3.1:70b (solid, already installed).
                                      # Arabic specialist (best, but needs GGUF import, not on Ollama): Jais.
    api_key: ollama                   # dummy; Ollama ignores it. Nothing leaves the machine.
    api_base: http://localhost:11434/v1
    concurrency: 1                    # serial — stable on a single local Ollama
    request_timeout: 1800.0
    call_args:
      timeout: 1800
    retry:
      type: exponential_backoff

  summarization_model:
    model_provider: openai
    model: qwen3-nothink-16k
    api_key: ollama
    api_base: http://localhost:11434/v1
    concurrency: 4
    request_timeout: 1800.0
    call_args:
      timeout: 1800
      max_tokens: 2500
      temperature: 0.1
      frequency_penalty: 0.2
    retry:
      type: exponential_backoff

  answer_model:
    model_provider: openai
    model: gemma4:26b
    api_key: ollama
    api_base: http://localhost:11434/v1
    concurrency: 1
    request_timeout: 1800.0
    retry:
      type: exponential_backoff

embedding_models:
  default_embedding_model:
    model_provider: openai
    model: qwen3-embedding:8b         # confirmed — 4096-dim embeddings
    api_key: ollama
    api_base: http://localhost:11434/v1
    retry:
      type: exponential_backoff

### Document processing settings ###
input:
  type: text
  base_dir: "input"                   # put the 477 content*.txt files here
  file_pattern: ".*\\.txt$$"           # CHANGED from code extensions — Saadeh corpus is .txt only
  recursive: true
  encoding: utf-8                     # correct for Arabic — do not change

chunking:
  type: tokens
  size: 1200
  overlap: 100
  encoding_model: cl100k_base

### Storage & Cache settings ###
storage:
  type: file
  base_dir: "output"

reporting:
  type: file
  base_dir: "output"

cache:
  type: json
  storage:
    type: file
    base_dir: "cache"

vector_store:
  type: lancedb
  db_uri: "output/lancedb"

### Workflow settings ###
embed_text:
  embedding_model_id: default_embedding_model

extract_graph:
  completion_model_id: default_completion_model
  prompt: "prompts/extract_graph.txt"
  entity_types: [person, organization, geo, event, concept, ideology, group]  # CHANGED for an Arabic philosophy/nationalism corpus (group = peoples/minorities)
  max_gleanings: 1

summarize_descriptions:
  completion_model_id: summarization_model
  prompt: "prompts/summarize_descriptions.txt"
  max_length: 500

cluster_graph:
  max_cluster_size: 10

community_reports:
  completion_model_id: summarization_model
  graph_prompt: "prompts/community_report_graph.txt"
  text_prompt: "prompts/community_report_text.txt"
  max_length: 2000
  max_input_length: 12000

### Search / Query settings ###
local_search:
  completion_model_id: answer_model
  embedding_model_id: default_embedding_model

global_search:
  completion_model_id: answer_model

### Parallelization (throttled for stability on one local box) ###
parallelization:
  stagger: 0.5
  num_threads: 4

basic_search:
  completion_model_id: answer_model
  embedding_model_id: default_embedding_model


workflows: [create_community_reports, generate_text_embeddings]
